<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BRTC — Static Bending Strength Test (1103-91247/26-27/CE)</title>
  <meta name="robots" content="noindex">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #2b2f36;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background: rgba(20, 22, 26, .94);
    }
    .toolbar button {
      appearance: none;
      border: 0;
      background: #1f4e79;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
    }
    .stage {
      display: flex;
      justify-content: center;
      padding: 16px 10px 36px;
    }
    .page {
      width: 210mm;
      max-width: 100%;
      background: #fff;
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
    }
    .page img {
      display: block;
      width: 100%;
      height: auto;
    }
    @page { size: A4; margin: 0; }
    @media print {
      html, body { background: #fff; }
      .toolbar { display: none !important; }
      .stage { padding: 0; }
      .page { width: 210mm; box-shadow: none; }
      .page img { width: 210mm; height: 297mm; object-fit: contain; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button type="button" onclick="window.print()">Print A4</button>
  </div>
  <div class="stage">
    <article class="page">
      <img src="img/report.jpg" alt="Static Bending Strength Test of a Prestressed Concrete Sleeper, BRTC No. 1103-91247/26-27/CE">
    </article>
  </div>
</body>
</html>
